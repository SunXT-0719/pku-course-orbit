<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="导入北大树洞成绩页面，按课程类型与学分排布。">
  <title>CourseOrbit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="CourseOrbit 首页">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>CourseOrbit</span>
      </a>
      <details class="notice">
        <summary>用户须知</summary>
        <div class="notice-content">
          <p><strong>获取 HTML</strong></p>
          <ol>
            <li>打开北大树洞成绩查询页面，等待成绩加载完成。</li>
            <li>在浏览器菜单中选择”网页另存为”。</li>
            <li>保存格式选择”网页，全部”，然后在此导入 HTML 文件。</li>
          </ol>
          <p><strong>Safari 用户</strong></p>
          <ol>
            <li>打开成绩页面后，选择”文件 → 存储为…”。</li>
            <li>格式选择<strong>”页面归档”</strong>（.webarchive）或”页面源码”（.html），然后在此导入。</li>
          </ol>
          <p><strong>隐私</strong></p>
          <p>文件仅在当前浏览器中读取，不会上传、保存或分享给服务器；刷新页面后数据即被清除。</p>
        </div>
      </details>
    </header>

    <section class="intro" aria-label="项目说明">
      <p class="lead">导入北大树洞成绩页面，按课程类型与学分排布</p>
    </section>

    <section id="upload-panel" class="upload-panel" aria-label="导入成绩页面">
      <div class="orbit-art" aria-hidden="true">
        <span class="orbit orbit-one"></span>
        <span class="orbit orbit-two"></span>
        <span class="planet"></span>
      </div>
      <label class="file-button" for="html-file">选择 HTML 或 .webarchive 文件</label>
      <input id="html-file" type="file" accept=".html,.htm,.webarchive,text/html">
      <p id="drop-hint" class="drop-hint">也可以将文件拖到这里</p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="result" class="result" hidden aria-labelledby="result-title">
      <div class="result-bar">
        <div>
          <p class="eyebrow">生成结果</p>
          <h2 id="result-title">课程成绩图谱</h2>
        </div>
        <div class="actions">
          <label for="semester">学期</label>
          <select id="semester"></select>
          <button id="download" type="button">下载 PNG</button>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="orbit-canvas" width="1800" height="1800" role="img" aria-label="课程成绩圆形气泡图"></canvas>
      </div>
      <p id="summary" class="summary"></p>
      <ul id="accessible-courses" class="sr-only"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
